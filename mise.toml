[tools]
bun = "1.4.2"

[tasks.openapi]
description = "Download the KantanDB contract when absent"
run = "bun scripts/openapi.js --force"
sources = ["scripts/openapi.js"]
outputs = ["openapi.yaml"]

[tasks.openapi-refresh]
description = "Refresh the KantanDB contract"
run = "bun scripts/openapi.js --force"

[tasks.fixture]
description = "Generate the inventory fixture when absent"
run = "bun scripts/fixture.js --force"
sources = ["scripts/fixture.js", "src/inventory.js"]
outputs = ["fixtures/inventory.ndjson"]

[tasks.fixture-refresh]
description = "Regenerate the inventory fixture"
run = "bun scripts/fixture.js --force"

[tasks.key]
description = "Create the KantanDB key when absent"
run = "bun scripts/key.js"
sources = ["scripts/key.js"]
outputs = ["kantan.key"]

[tasks.db]
description = "Start KantanDB"
depends = ["key"]
run = "bun scripts/db.js"

[tasks.bootstrap]
description = "Create and populate the inventory database"
depends = ["fixture", "key"]
run = "bun scripts/bootstrap.js"

[tasks.setup]
description = "Prepare the local project"
run = """
mise run openapi
mise run fixture
mise run key
bun scripts/setup.js
"""

[tasks.stats]
description = "Show inventory fixture statistics"
depends = ["fixture"]
run = "bun scripts/stats.js"

[tasks.dev]
description = "Start development mode"
run = "bun run dev"

[tasks.start]
description = "Start the application"
run = "bun run start"

[tasks.browser-install]
description = "Install the Playwright browser"
run = "bun run browser:install"

[tasks.test]
description = "Run tests"
run = "bun run test"

[tasks.check]
description = "Run all checks"
run = "bun run check"
